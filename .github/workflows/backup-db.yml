name: Backup do banco (semanal)

# Backup automático do Postgres da Supabase. Roda todo domingo 06:00 UTC
# (03:00 BRT) e também dá pra disparar na mão pela aba Actions.
#
# Setup (uma vez): Settings → Secrets and variables → Actions → New secret
#   SUPABASE_DB_URL = postgresql://postgres:SENHA@db.<ref>.supabase.co:5432/postgres
#   (Supabase → Project Settings → Database → Connection string → URI)
#
# O .dump fica como artefato do run, retido 90 dias. Baixe da aba Actions.
# Ver docs/BACKUP.md pra restaurar.

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pg_dump (Postgres 16 client)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup-db.mjs

      - name: Guardar o .dump como artefato
        uses: actions/upload-artifact@v4
        with:
          name: leeva-db-backup
          path: backups/*.dump
          retention-days: 90
          # 'ignore' porque, sem o secret SUPABASE_DB_URL, o backup é pulado
          # (o run fica verde). Depois de configurar, vira um backup real.
          if-no-files-found: ignore
